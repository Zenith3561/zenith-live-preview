<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Live Preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0}
  .card{text-align:center;padding:3rem}
  h1{font-size:3rem;margin:0 0 .5rem;background:linear-gradient(90deg,#38bdf8,#a78bfa);
     -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .ver{font-family:monospace;font-size:1.1rem;color:#94a3b8;margin:.8rem 0}
  .deploy{color:#34d399;font-size:1rem;margin-top:1.2rem}
  .time{color:#64748b;font-size:.9rem;margin-top:.5rem}
</style>
</head>
<body>
<div class="card">
  <h1>Zenith Live Preview</h1>
  <div class="ver">build version: v2 · __SHA__</div>
  <div class="deploy">由 Zen 團隊自動部署 ✅</div>
  <div class="time" id="t"></div>
</div>
<script>document.getElementById('t').textContent='now: '+new Date().toLocaleString('zh-HK');</script>
</body>
</html>
